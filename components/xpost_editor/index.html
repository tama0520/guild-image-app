<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X投稿用 画像結合エディター</title>
<style>
  :root{--bd:#c9cdd6;--fr:#5b2fb3;--pool:#f4f5f8;--sel:#ff7a00;--txt:#222;--sub:#666}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:"Meiryo","Hiragino Sans",sans-serif;color:var(--txt);background:transparent;font-size:13px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px}
  .bar .hint{color:var(--sub);font-size:12px;flex:1 1 220px}
  button{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;touch-action:manipulation}
  button:hover{background:#eef}
  button.on{background:var(--fr);color:#fff;border-color:var(--fr)}
  button:disabled{opacity:.4;cursor:default}
  .sec{border:1px solid var(--bd);border-radius:8px;padding:6px;margin-bottom:10px;background:#fff}
  .sec h4{margin:0 0 6px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sec h4 .cnt{font-weight:normal;color:var(--sub);font-size:12px}
  .pool{background:var(--pool)}
  .zone{min-height:64px;border:2px dashed transparent;border-radius:6px;padding:3px;transition:background .1s}
  .zone.over{border-color:var(--sel);background:#fff4e8}
  .pool .zone{display:flex;flex-wrap:wrap;gap:6px}
  .pool .card{width:104px}
  .cols{display:grid;gap:6px}
  .col{border:1px solid #e3e5ea;border-radius:6px;background:#fafbfc;display:flex;flex-direction:column;min-width:0}
  .colh{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:3px;border-bottom:1px solid #e3e5ea;font-size:11px;color:var(--sub)}
  .colh button{padding:1px 6px;font-size:11px}
  .colh .wl{flex:1;text-align:center;min-width:40px}
  .col .zone{flex:1;display:flex;flex-direction:column;gap:4px;align-items:center}
  .col .card{width:100%;max-width:150px}
  .col .card img{max-height:220px;object-fit:contain}
  .col .mk{width:100%}
  .card{position:relative;border:1px solid var(--bd);border-radius:6px;background:#fff;padding:3px;user-select:none;-webkit-user-select:none;cursor:grab}
  .card img{display:block;width:100%;height:auto;border-radius:3px;pointer-events:none;background:#eee}
  .card .lb{font-size:11px;line-height:1.25;margin-top:2px;word-break:break-all}
  .card .tg{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;color:#fff;margin-right:3px}
  .tg.zen{background:#c0392b}.tg.high{background:#d35400}.tg.side{background:#2c7be5}.tg.etc{background:#7f8c8d}
  .card .ops{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
  .card .ops button{padding:1px 6px;font-size:11px}
  .card .hdl{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:6px;background:rgba(91,47,179,.85);color:#fff;
             display:flex;align-items:center;justify-content:center;font-size:16px;touch-action:none;cursor:grab}
  .card.sel{outline:3px solid var(--sel)}
  .card.dragging{opacity:.35}
  .ghost{position:fixed;z-index:9999;width:110px;pointer-events:none;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.3);transform:rotate(2deg)}
  .mk{height:4px;background:var(--sel);border-radius:2px;margin:1px 0}
  .here{border:2px dashed var(--sel);color:var(--sel);background:#fff;width:100%;padding:6px;border-radius:6px}
  .pool .here{width:104px;min-height:60px}
  .empty{color:#aaa;font-size:12px;text-align:center;padding:14px 4px}
  .warn{color:#b00020}
  /* 1〜4枠（左）＋5枠目＝完成プレビュー（右端・確認専用） */
  .main{display:grid;grid-template-columns:minmax(0,1fr) var(--pvw);gap:8px;align-items:start}
  :root{--pvw:clamp(200px,28vw,360px)}
  .left{min-width:0}
  .sec.cur{border-color:var(--fr);box-shadow:0 0 0 2px rgba(91,47,179,.25)}
  .sec h4 .pvb{margin-left:auto}
  .pvpane{border:1px solid var(--fr);border-radius:8px;background:#fff;padding:6px;will-change:transform;position:relative;z-index:2}
  .pvpane h4{margin:0 0 4px;font-size:14px}
  .pvtabs{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
  .pvtabs button{padding:1px 7px;font-size:12px}
  .pvbody{position:relative;overflow:auto;border-radius:4px;border:1px solid #d5d9e2;
          background:repeating-conic-gradient(#e6e9ef 0% 25%,#f7f8fa 0% 50%) 0 0/16px 16px;
          display:flex;justify-content:center;align-items:flex-start}
  .pvbody img{display:block;height:auto;max-width:100%}
  .pvbody.fit img{width:auto;max-width:100%}
  .pvbody.wide img{width:100%}
  .pvstale{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
  .pvbody.stale img{opacity:.45}
  .pvcap{font-size:11px;line-height:1.35;color:var(--sub);margin-top:4px;word-break:break-all}
  .pvnone{color:#999;font-size:12px;text-align:center;padding:24px 6px}
  @media (max-width:640px){
    .main{grid-template-columns:minmax(0,1fr)}
    .pvpane{order:-1}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ── Streamlit コンポーネントの通信（公式 JS ライブラリなしの最小実装）─────────
function send(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, data||{}), "*"); }
let MAT = {}, ORDER = [], L = null, REV = null, HIST = [], SEL = null, DRAGGING = false;
let PV = [], PVLAY = "", CUR = null, FIT = "fit";   // 5枠目：完成画像（サーバーで⑧と同じ結合）・表示中の枠・表示方法
const NF = 4, MC = 4;

window.addEventListener("message", function(ev){
  const d = ev.data;
  if(!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  MAT = {}; ORDER = [];
  (a.materials || []).forEach(function(m){ MAT[m.id] = m; ORDER.push(m.id); });
  if(a.rev !== REV || !L){ REV = a.rev; L = norm(a.layout); HIST = []; SEL = null; }
  else { L = norm(L); }
  PV = a.previews || []; PVLAY = JSON.stringify(norm(a.layout));
  if(!DRAGGING) render();
});
send("streamlit:componentReady", {apiVersion:1});

function commit(){ send("streamlit:setComponentValue", {value:{layout:L, rev:REV}, dataType:"json"}); }
// 高さは中身（#app）だけで測る。iframe 自身の高さを含む scrollHeight を使うと、
// 高さを送る→iframe が伸びる→また伸びた高さを送る、の繰り返しで無限に伸びる。
let LAST_H = -1;
function setH(){
  const a = document.getElementById("app"); if(!a) return;
  const h = Math.ceil(a.getBoundingClientRect().height) + 8;
  if(h !== LAST_H){ LAST_H = h; send("streamlit:setFrameHeight", {height: h}); }
}
new ResizeObserver(setH).observe(document.getElementById("app"));

// ── 配置データ ─────────────────────────────────────────────
function norm(lay){
  const seen = new Set(); const fr = [];
  const src = (lay && lay.frames) || [];
  for(let f=0; f<NF; f++){
    const cols = [];
    ((src[f] && src[f].cols) || []).slice(0, MC).forEach(function(c){
      const it = (c.items || []).filter(function(i){ if(!(i in MAT) || seen.has(i)) return false; seen.add(i); return true; });
      cols.push({items: it, pad: (typeof c.pad === "number" && c.pad > 0) ? Math.min(2000, Math.round(c.pad)) : 0});
    });
    fr.push({cols: cols.length ? cols : [{items: [], pad: 0}]});
  }
  return {frames: fr};
}
function placed(){ const s = new Set(); L.frames.forEach(function(f){ f.cols.forEach(function(c){ c.items.forEach(function(i){ s.add(i); }); }); }); return s; }
function poolIds(){ const s = placed(); return ORDER.filter(function(i){ return !s.has(i); }); }
function snap(){ HIST.push(JSON.stringify(L)); if(HIST.length > 80) HIST.shift(); }
function change(fn){ snap(); fn(); render(); commit(); }
function findItem(id){
  for(let f=0; f<NF; f++) for(let c=0; c<L.frames[f].cols.length; c++){
    const k = L.frames[f].cols[c].items.indexOf(id); if(k >= 0) return {f:f, c:c, k:k};
  }
  return null;
}
function moveTo(id, zone, idx){
  const zm = /^f(\d)c/.exec(zone || ""); if(zm) CUR = +zm[1];
  change(function(){
    const src = findItem(id);
    if(src) L.frames[src.f].cols[src.c].items.splice(src.k, 1);
    if(zone === "pool") return;
    const m = /^f(\d)c(\d)$/.exec(zone);
    const col = L.frames[+m[1]].cols[+m[2]];
    if(src && src.f === +m[1] && src.c === +m[2] && idx != null && src.k < idx) idx--;
    if(idx == null || idx > col.items.length) idx = col.items.length;
    col.items.splice(idx, 0, id);
  });
}
function setCols(f, k){
  CUR = f;
  change(function(){
    const cols = L.frames[f].cols;
    while(cols.length < k) cols.push({items: [], pad: 0});
    while(cols.length > k){ const rm = cols.pop(); cols[cols.length-1].items = cols[cols.length-1].items.concat(rm.items); }
  });
}
function shiftCol(f, c, d){
  CUR = f;
  change(function(){ const cols = L.frames[f].cols; const t = c + d; if(t < 0 || t >= cols.length) return; const x = cols[c]; cols[c] = cols[t]; cols[t] = x; });
}
// 列の余白（px）を増減する。素材の大きさは変えない（列の幅だけが広がり、素材は列の中央）
function padAdj(f, c, d){
  CUR = f;
  change(function(){ const col = L.frames[f].cols[c]; col.pad = Math.max(0, Math.min(2000, (col.pad || 0) + d)); });
}
function resetPad(f){ CUR = f; change(function(){ L.frames[f].cols.forEach(function(c){ c.pad = 0; }); }); }
function colWidth(c){ return c.items.reduce(function(m, i){ return Math.max(m, (MAT[i] && MAT[i].w) || 0); }, 0); }
function clearFrame(f){ CUR = f; change(function(){ L.frames[f].cols.forEach(function(c){ c.items = []; }); }); }
function stepItem(id, d){
  const sp = findItem(id); if(sp) CUR = sp.f;
  change(function(){ const p = findItem(id); if(!p) return; const it = L.frames[p.f].cols[p.c].items; const t = p.k + d; if(t < 0 || t >= it.length) return; it[p.k] = it[t]; it[t] = id; });
}
function undo(){ if(!HIST.length) return; L = norm(JSON.parse(HIST.pop())); SEL = null; render(); commit(); }

// ── 描画 ─────────────────────────────────────────────────
function el(t, a){
  const e = document.createElement(t); a = a || {};
  for(const k in a){
    if(k === "class") e.className = a[k];
    else if(k === "text") e.textContent = a[k];
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]);
  }
  for(let i=2; i<arguments.length; i++){ const x = arguments[i]; if(x == null) continue; if(Array.isArray(x)) x.forEach(function(y){ if(y) e.append(y); }); else e.append(x); }
  return e;
}
function btn(label, fn, cls, title){
  const b = el("button", {class: cls || "", type: "button", title: title || label, text: label});
  b.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });
  return b;
}
function card(id, inCol){
  const m = MAT[id];
  const c = el("div", {class: "card" + (SEL === id ? " sel" : ""), "data-id": id});
  c.append(el("img", {src: m.thumb, alt: m.label, draggable: "false"}));
  const tg = el("span", {class: "tg " + (m.cat || "etc"), text: m.tag || ""});
  c.append(el("div", {class: "lb"}, m.tag ? tg : null, document.createTextNode(m.label)));
  c.append(el("div", {class: "hdl", title: "ドラッグで移動"}, "✥"));
  if(inCol){
    c.append(el("div", {class: "ops"},
      btn("↑", function(){ stepItem(id, -1); }, "", "上へ"),
      btn("↓", function(){ stepItem(id, 1); }, "", "下へ"),
      btn("×", function(){ moveTo(id, "pool"); }, "", "未配置へ戻す")));
  }
  c.addEventListener("pointerdown", function(e){ startDrag(e, id, c); });
  return c;
}
function hereBtn(zone){
  return btn("＋ここへ", function(){ const id = SEL; SEL = null; moveTo(id, zone, null); }, "here", "選択中の素材をここへ移動");
}
function render(){
  const app = document.getElementById("app"); app.innerHTML = "";
  app.append(el("div", {class: "bar"},
    btn("↩ 元に戻す", undo, "", "直前の操作を取り消す"),
    el("span", {class: "hint", text: SEL ? "選択中：「＋ここへ」を押すと移動します（もう一度タップで解除）"
      : "素材をドラッグして枠へ入れます（スマホは右上の ✥ をドラッグ、またはタップで選択→「＋ここへ」）"})));
  const main = el("div", {class: "main"}); const left = el("div", {class: "left"});
  main.append(left, pvPane()); app.append(main);
  const ids = poolIds();
  const pz = el("div", {class: "zone", "data-zone": "pool"});
  ids.forEach(function(i){ pz.append(card(i, false)); });
  if(SEL && !ids.includes(SEL)) pz.append(hereBtn("pool"));
  if(!ids.length && !SEL) pz.append(el("div", {class: "empty", text: "未配置の素材はありません"}));
  left.append(el("div", {class: "sec pool"}, el("h4", {}, "未配置の素材", el("span", {class: "cnt", text: ids.length + "件"})), pz));
  for(let f=0; f<NF; f++){
    const fr = L.frames[f]; const k = fr.cols.length;
    const n = fr.cols.reduce(function(s, c){ return s + c.items.length; }, 0);
    const h = el("h4", {}, "■" + (f+1) + "枚目", el("span", {class: "cnt", text: n ? n + "件・横" + k + "列" : "（未使用）"}));
    for(let j=1; j<=MC; j++) h.append(btn(j + "列", (function(jj){ return function(){ setCols(f, jj); }; })(j), j === k ? "on" : ""));
    h.append(btn("余白をリセット", function(){ resetPad(f); }, "", "列に足した余白をすべて0に戻す"));
    h.append(btn("空にする", function(){ clearFrame(f); }, "", "この枠の素材を未配置へ戻す"));
    if(n) h.append(btn("👁 完成を見る", function(){ CUR = f; render(); }, "pvb" + (curFrame() === f ? " on" : ""), "右端の完成プレビューにこの枠を表示"));
    const grid = el("div", {class: "cols"}); grid.style.gridTemplateColumns = "repeat(" + k + ", minmax(0,1fr))";
    fr.cols.forEach(function(c, ci){
      const cw = colWidth(c);
      const wl = cw ? (cw + (c.pad || 0)) + "px" + (c.pad ? "（余白+" + c.pad + "）" : "") : "―";
      const ch = el("div", {class: "colh"},
        btn("◀", function(){ shiftCol(f, ci, -1); }, "", "列を左へ"),
        btn("−", function(){ padAdj(f, ci, -100); }, "", "列の余白を100px減らす（素材の大きさは変わりません）"),
        el("span", {class: "wl", text: "列" + (ci+1) + " " + wl}),
        btn("＋", function(){ padAdj(f, ci, 100); }, "", "列の余白を100px増やす（素材の大きさは変わりません）"),
        btn("▶", function(){ shiftCol(f, ci, 1); }, "", "列を右へ"));
      const z = el("div", {class: "zone", "data-zone": "f" + f + "c" + ci});
      c.items.forEach(function(i){ z.append(card(i, true)); });
      if(SEL) z.append(hereBtn("f" + f + "c" + ci));
      else if(!c.items.length) z.append(el("div", {class: "empty", text: "ここへドロップ"}));
      grid.append(el("div", {class: "col"}, ch, z));
    });
    left.append(el("div", {class: "sec" + (curFrame() === f ? " cur" : "")}, h, grid));
  }
  setH(); follow();
}

// ── 5枠目：完成プレビュー（確認専用・ここへは配置できない）────────────────
function curFrame(){
  const used = PV.map(function(p){ return p.frame; });
  if(CUR != null && (used.indexOf(CUR) >= 0 || L.frames[CUR].cols.some(function(c){ return c.items.length; }))) return CUR;
  return used.length ? used[0] : null;
}
function pvPane(){
  const f = curFrame();
  const pane = el("div", {class: "pvpane", id: "pvpane"});
  const tabs = el("div", {class: "pvtabs"});
  for(let i=0; i<NF; i++){
    const has = PV.some(function(p){ return p.frame === i; });
    const b = btn((i+1) + "枚目", (function(ii){ return function(){ CUR = ii; render(); }; })(i), i === f ? "on" : "", "■" + (i+1) + "枚目の完成画像");
    if(!has) b.disabled = true;
    tabs.append(b);
  }
  const vw = el("div", {class: "pvtabs"});
  vw.append(btn("全体", function(){ FIT = "fit"; render(); }, FIT === "fit" ? "on" : "", "完成画像全体を枠の中に収めて表示（縦横比そのまま）"));
  vw.append(btn("幅に合わせる", function(){ FIT = "wide"; render(); }, FIT === "wide" ? "on" : "", "枠の幅いっぱいに表示して、枠の中を縦にスクロール"));
  pane.append(el("h4", {}, "5枠目：完成プレビュー"), tabs, vw);
  const p = PV.filter(function(x){ return x.frame === f; })[0];
  const stale = JSON.stringify(L) !== PVLAY;
  const body = el("div", {class: "pvbody " + FIT + (stale ? " stale" : "")});
  if(p){
    const im = el("img", {src: p.url, alt: p.name + " の完成プレビュー", draggable: "false"});
    im.addEventListener("load", follow);
    body.append(im);
    if(stale) body.append(el("span", {class: "pvstale", text: "更新中…"}));
    pane.append(body);
    pane.append(el("div", {class: "pvcap", text:
      p.name + "（■" + (p.frame+1) + "枚目・横" + p.ncol + "列）出力 " + p.w + "×" + p.h + "px・縦横比 1:" + p.ratio +
      "・余白 " + p.blank + "%・JPEG " + p.mb + "MB（品質" + p.q + "）" +
      (p.scale < 99.95 ? "・全体を" + p.scale + "%に縮小して出力" : "・素材は等倍")}));
    pane.append(el("div", {class: "pvcap", text: "確認専用（ここには配置できません）。表示は縮小・縦横比はそのまま。青い部分が余白です。"}));
  } else {
    body.append(el("div", {class: "pvnone", text: f == null ? "配置するとここに完成画像が出ます" : (stale ? "更新中…" : "この枠は未使用です")}));
    pane.append(body);
  }
  return pane;
}
// 5枠目は、ページをスクロールしても画面内に見えるように左の枠の範囲で追従する（PC幅のみ）
function follow(){
  const pane = document.getElementById("pvpane"); const main = document.querySelector(".main");
  if(!pane || !main) return;
  const body = pane.querySelector(".pvbody");
  let vh = 800, top = 0;
  let hd = 0;   // 画面上部の Streamlit ヘッダー（Deploy の帯）に隠れないように、その下へ置く
  try{
    vh = window.parent.innerHeight; top = window.frameElement.getBoundingClientRect().top;
    const hh = window.parent.document.querySelector('[data-testid="stHeader"]');
    if(hh) hd = Math.max(0, hh.getBoundingClientRect().bottom);
  }catch(e){}
  const narrow = window.matchMedia("(max-width:640px)").matches;
  const capH = pane.offsetHeight - (body ? body.offsetHeight : 0);
  const mh = Math.max(160, (narrow ? vh * 0.45 : vh - hd - 24) - capH);
  if(body){
    body.style.maxHeight = mh + "px";
    const im = body.querySelector("img");
    if(im) im.style.maxHeight = (FIT === "fit") ? (mh - 2) + "px" : "none";
  }
  if(narrow){ pane.style.transform = ""; return; }
  const mr = main.getBoundingClientRect();
  const off = Math.max(0, Math.min(hd - (top + mr.top) + 8, mr.height - pane.offsetHeight));
  pane.style.transform = off ? "translateY(" + Math.round(off) + "px)" : "";
}
(function(){
  try{
    const s = scroller(); if(s) s.addEventListener("scroll", follow, {passive: true});
    window.parent.addEventListener("resize", follow);
  }catch(e){}
  window.addEventListener("resize", follow);
})();

// ── ドラッグ（マウス・タッチ共通の Pointer Events）────────────────────
function scroller(){
  try{
    const pd = window.parent.document;
    return pd.querySelector('[data-testid="stMain"]') || pd.querySelector('[data-testid="stAppViewContainer"]') || pd.scrollingElement;
  }catch(e){ return null; }
}
function autoScroll(y){
  try{
    const r = window.frameElement.getBoundingClientRect();
    const vh = window.parent.innerHeight; const yy = r.top + y;
    const s = scroller(); if(!s) return;
    if(yy < 70) s.scrollBy(0, -18); else if(yy > vh - 70) s.scrollBy(0, 18);
  }catch(e){}
}
function hit(x, y){
  const pp = document.getElementById("pvpane");
  if(pp){ const r = pp.getBoundingClientRect(); if(x >= r.left - 4 && x <= r.right + 4 && y >= r.top - 4 && y <= r.bottom + 4) return null; }
  const zs = document.querySelectorAll("[data-zone]");
  let best = null, bd = 1e9;
  zs.forEach(function(z){
    const r = z.getBoundingClientRect();
    const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
    const d = Math.hypot(dx, dy); if(d < bd){ bd = d; best = z; }
  });
  if(!best || bd > 40) return null;
  const zone = best.getAttribute("data-zone");
  if(zone === "pool") return {el: best, zone: zone, idx: null};
  const cards = Array.prototype.filter.call(best.querySelectorAll(":scope > .card"), function(c){ return !c.classList.contains("dragging"); });
  let idx = 0;
  cards.forEach(function(c){ const r = c.getBoundingClientRect(); if(y > r.top + r.height / 2) idx++; });
  // ドラッグ中の元カードを含めた並びでの位置へ直す
  const all = Array.prototype.slice.call(best.querySelectorAll(":scope > .card"));
  const realIdx = (function(){ let n = 0, k = 0; for(const c of all){ if(c.classList.contains("dragging")){ k++; continue; } if(n === idx) break; n++; k++; } return k; })();
  return {el: best, zone: zone, idx: realIdx, cards: cards, vis: idx};
}
let MK = null;
function showMark(t){
  document.querySelectorAll(".zone.over").forEach(function(z){ z.classList.remove("over"); });
  if(MK){ MK.remove(); MK = null; }
  if(!t) return;
  t.el.classList.add("over");
  if(t.zone !== "pool"){
    MK = el("div", {class: "mk"});
    const ref = t.cards[t.vis];
    if(ref) t.el.insertBefore(MK, ref); else t.el.append(MK);
  }
}
function startDrag(e, id, c){
  if(e.button !== undefined && e.button !== 0) return;
  const touch = e.pointerType && e.pointerType !== "mouse";
  if(touch && !e.target.closest(".hdl")){ return; }   // タッチはつまみ（✥）だけでドラッグ（画面のスクロールを妨げない）
  const sx = e.clientX, sy = e.clientY; let ghost = null;
  if(touch) e.preventDefault();
  function mv(ev){
    if(!ghost){
      if(Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      ghost = c.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel");
      document.body.append(ghost); c.classList.add("dragging"); DRAGGING = true;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - 40) + "px"; ghost.style.top = (ev.clientY - 24) + "px";
    showMark(hit(ev.clientX, ev.clientY)); autoScroll(ev.clientY);
  }
  function up(ev){
    window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    if(ghost){
      const t = (ev.type === "pointercancel") ? null : hit(ev.clientX, ev.clientY);
      ghost.remove(); c.classList.remove("dragging"); showMark(null); DRAGGING = false;
      if(t) moveTo(id, t.zone, t.idx); else render();
    } else if(!touch || e.target.closest(".hdl")){
      SEL = (SEL === id) ? null : id; render();
    }
  }
  window.addEventListener("pointermove", mv, {passive: false});
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}
// タッチ：つまみ以外のタップで選択（スクロールと区別するため click で判定）
document.addEventListener("click", function(e){
  const c = e.target.closest && e.target.closest(".card");
  if(!c || e.target.closest("button") || e.target.closest(".hdl")) return;
  if(e.pointerType === "mouse") return;
  if(window.matchMedia("(pointer: coarse)").matches){ const id = c.getAttribute("data-id"); SEL = (SEL === id) ? null : id; render(); }
});
</script>
